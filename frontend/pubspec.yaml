name: finance_app
description: "A modern Personal & Family Finance Tracker built with Flutter & UI/UX Pro Max"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.1
  intl: ^0.19.0
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.1
  image_picker: ^1.1.2
  file_picker: ^13.4.1
  path: ^1.9.0
  path_provider: ^2.1.3
  open_filex: ^4.4.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
